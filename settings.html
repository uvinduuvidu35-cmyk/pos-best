<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCK Footwear - Settings</title>
    <style>
        :root {
            --bg-color: #0b0d14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --primary-blue: #0088ff;
            --gradient-start: #0284c7;
            --gradient-end: #0369a1;
            --sidebar-bg: #0f172a;
            --input-bg: rgba(255, 255, 255, 0.05);
            --option-bg: #0f172a;
            --option-text: #ffffff;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary-blue: #0284c7;
            --gradient-start: #0284c7;
            --gradient-end: #0369a1;
            --sidebar-bg: #ffffff;
            --input-bg: #f1f5f9;
            --option-bg: #ffffff;
            --option-text: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .sidebar-brand h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li a {
            display: block;
            padding: 12px 16px;
            color: var(--text-sub);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .nav-links li a:hover, .nav-links li a.active {
            background: rgba(0, 136, 255, 0.15);
            color: var(--primary-blue);
            border: 1px solid var(--primary-blue);
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .welcome-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .theme-btn, .translate-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .translate-btn {
            background: var(--primary-blue);
            color: #fff;
            border: none;
        }

        /* Settings Cards Container */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .settings-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-blue);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-info label {
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .setting-info p {
            font-size: 12px;
            color: var(--text-sub);
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .form-control option {
            background-color: var(--option-bg);
            color: var(--option-text);
        }

        .save-btn {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-start;
        }

        .save-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="sidebar-brand">
                <h2>DCK Footwear</h2>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="sales.html">Sales & Billing</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="Customer.html">Customers</a></li>
                <li><a href="chat.html">Charts</a></li>
                <li><a href="settings.html" class="active">Settings</a></li>
            </ul>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Sign Out</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="top-header">
            <h1 id="headerTitle">Settings</h1>
            <div class="user-profile">
                <button class="translate-btn" onclick="translateContent()">සිංහල</button>
                <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
                <div class="welcome-badge">
                    <div class="avatar">G</div>
                    <span id="welcomeText">Welcome, Gamini</span>
                </div>
            </div>
        </div>

        <div class="settings-grid">
            <!-- Appearance Settings -->
            <div class="settings-card">
                <h2 class="card-title" id="secAppearance">Appearance & Language</h2>
                
                <div class="setting-item">
                    <div class="setting-info">
                        <label id="lblTheme">Theme Mode</label>
                        <p id="descTheme">Switch between Dark and Light themes</p>
                    </div>
                    <button class="theme-btn" onclick="toggleTheme()" id="btnThemeToggle">Toggle Theme</button>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <label id="lblLanguage">System Language</label>
                        <p id="descLanguage">Select system display language</p>
                    </div>
                    <select id="langSelect" class="form-control" style="width: auto;" onchange="changeLanguageFromDropdown(this.value)">
                        <option value="en">English</option>
                        <option value="si">සිංහල</option>
                    </select>
                </div>
            </div>

            <!-- Profile Settings -->
            <div class="settings-card">
                <h2 class="card-title" id="secProfile">Profile Settings</h2>
                
                <div>
                    <label id="lblStoreName" style="font-size: 13px; color: var(--text-sub); display: block; margin-bottom: 6px;">Store Name</label>
                    <input type="text" class="form-control" value="DCK Footwear">
                </div>

                <div>
                    <label id="lblUserName" style="font-size: 13px; color: var(--text-sub); display: block; margin-bottom: 6px;">User Name</label>
                    <input type="text" class="form-control" value="Gamini Wijesinghe">
                </div>

                <button class="save-btn" id="btnSaveProfile" onclick="alert('Profile Saved Successfully!')">Save Changes</button>
            </div>
        </div>
    </main>

    <script>
        let isSinhala = false;

        const translations = {
            headerTitle: "සැකසීම් (Settings)",
            welcomeText: "ආයුබෝවන්, ගාමිණී",
            secAppearance: "පෙනුම සහ භාෂාව",
            lblTheme: "තීම් මාදිලිය",
            descTheme: "Dark සහ Light තීම් අතර මාරු වන්න",
            btnThemeToggle: "තීම් වෙනස් කරන්න",
            lblLanguage: "පද්ධති භාෂාව",
            descLanguage: "පද්ධතියේ භාෂාව තෝරන්න",
            secProfile: "ගිණුම් සැකසීම්",
            lblStoreName: "ආයතනයේ නම",
            lblUserName: "පරිශීලක නම",
            btnSaveProfile: "වෙනස්කම් සුරකින්න"
        };

        const originalTexts = {
            headerTitle: "Settings",
            welcomeText: "Welcome, Gamini",
            secAppearance: "Appearance & Language",
            lblTheme: "Theme Mode",
            descTheme: "Switch between Dark and Light themes",
            btnThemeToggle: "Toggle Theme",
            lblLanguage: "System Language",
            descLanguage: "Select system display language",
            secProfile: "Profile Settings",
            lblStoreName: "Store Name",
            lblUserName: "User Name",
            btnSaveProfile: "Save Changes"
        };

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            const savedLang = localStorage.getItem('language') || 'en';
            if (savedLang === 'si') {
                setSinhala(true);
            }
        };

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function translateContent() {
            setSinhala(!isSinhala);
        }

        function changeLanguageFromDropdown(val) {
            setSinhala(val === 'si');
        }

        function setSinhala(status) {
            isSinhala = status;
            localStorage.setItem('language', isSinhala ? 'si' : 'en');
            document.querySelector('.translate-btn').textContent = isSinhala ? 'English' : 'සිංහල';
            document.getElementById('langSelect').value = isSinhala ? 'si' : 'en';

            const dict = isSinhala ? translations : originalTexts;
            
            document.getElementById('headerTitle').textContent = dict.headerTitle;
            document.getElementById('welcomeText').textContent = dict.welcomeText;
            document.getElementById('secAppearance').textContent = dict.secAppearance;
            document.getElementById('lblTheme').textContent = dict.lblTheme;
            document.getElementById('descTheme').textContent = dict.descTheme;
            document.getElementById('btnThemeToggle').textContent = dict.btnThemeToggle;
            document.getElementById('lblLanguage').textContent = dict.lblLanguage;
            document.getElementById('descLanguage').textContent = dict.descLanguage;
            document.getElementById('secProfile').textContent = dict.secProfile;
            document.getElementById('lblStoreName').textContent = dict.lblStoreName;
            document.getElementById('lblUserName').textContent = dict.lblUserName;
            document.getElementById('btnSaveProfile').textContent = dict.btnSaveProfile;
        }
    </script>
</body>
</html>
