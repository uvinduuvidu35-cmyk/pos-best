<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCK Footwear - Inventory</title>
    <!-- JsBarcode Library for rendering barcodes -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 20px;
        }

        h2 {
            color: #00bcd4;
        }

        .form-container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #2b2b2b;
            color: #fff;
            box-sizing: border-box;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary { background-color: #00bcd4; color: #121212; }
        .btn-warning { background-color: #ff9800; color: #121212; }
        .btn-danger { background-color: #f44336; color: #fff; }
        .btn-secondary { background-color: #757575; color: #fff; }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #252525;
            color: #00bcd4;
        }

        /* PRINT STYLING */
        #printArea {
            display: none;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #printArea, #printArea * {
                visibility: visible;
            }

            #printArea {
                display: flex !important;
                flex-wrap: wrap;
                gap: 10px;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background-color: #fff;
                color: #000;
                padding: 10px;
            }

            .tag-card {
                border: 1px dashed #000;
                padding: 10px;
                width: 180px;
                text-align: center;
                box-sizing: border-box;
                page-break-inside: avoid;
            }

            .tag-title {
                font-size: 12px;
                font-weight: bold;
                margin-bottom: 2px;
            }

            .tag-details {
                font-size: 10px;
                margin-bottom: 5px;
            }

            .tag-price {
                font-size: 11px;
                font-weight: bold;
                margin-top: 3px;
            }

            svg {
                max-width: 100%;
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <h2>Stock Inventory</h2>

    <!-- Inventory Form -->
    <div class="form-container">
        <form id="inventoryForm">
            <input type="hidden" id="itemKey">
            <div class="form-group">
                <label>Barcode</label>
                <input type="text" id="barcode" required>
            </div>
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" id="itemName" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="category">
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Unisex">Unisex</option>
                </select>
            </div>
            <div class="form-group">
                <label>Color</label>
                <input type="text" id="color">
            </div>
            <div class="form-group">
                <label>Size</label>
                <input type="text" id="size">
            </div>
            <div class="form-group">
                <label>Price (LKR)</label>
                <input type="number" id="price" required>
            </div>
            <div class="form-group">
                <label>Stock Qty</label>
                <input type="number" id="stock" required>
            </div>
            
            <button type="button" class="btn btn-primary" onclick="saveItem()">Save Item</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear</button>
        </form>
    </div>

    <!-- Inventory Table -->
    <table>
        <thead>
            <tr>
                <th>Barcode</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Gender</th>
                <th>Color</th>
                <th>Size</th>
                <th>Price (LKR)</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="inventoryTableBody">
            <!-- Dynamic Content -->
        </tbody>
    </table>

    <!-- Print Area for Barcode Tags Only -->
    <div id="printArea"></div>

    <script>
        let globalInventory = {};

        // Function to render Table with Edit Button
        function renderTable(data) {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';
            
            globalInventory = data || {};

            Object.keys(globalInventory).forEach(key => {
                const item = globalInventory[key];
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${item.barcode || ''}</td>
                    <td>${item.name || ''}</td>
                    <td>${item.category || ''}</td>
                    <td>${item.gender || ''}</td>
                    <td>${item.color || ''}</td>
                    <td>${item.size || ''}</td>
                    <td>${item.price || 0}</td>
                    <td>${item.stock || 0}</td>
                    <td>
                        <button class="btn btn-warning" style="padding: 3px 8px; font-size: 12px;" onclick="populateProductDetails('${key}')">Edit</button>
                        <button class="btn btn-primary" style="padding: 3px 8px; font-size: 12px;" onclick="printSingleTag('${key}')">Print Tag</button>
                        <button class="btn btn-danger" style="padding: 3px 8px; font-size: 12px;" onclick="deleteItem('${key}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Populate Form Data for Editing
        function populateProductDetails(key) {
            const item = globalInventory[key];
            if (!item) return;

            document.getElementById('itemKey').value = key;
            document.getElementById('barcode').value = item.barcode || '';
            document.getElementById('itemName').value = item.name || '';
            document.getElementById('category').value = item.category || '';
            document.getElementById('gender').value = item.gender || '';
            document.getElementById('color').value = item.color || '';
            document.getElementById('size').value = item.size || '';
            document.getElementById('price').value = item.price || '';
            document.getElementById('stock').value = item.stock || '';
        }

        // Reset Form
        function resetForm() {
            document.getElementById('itemKey').value = '';
            document.getElementById('inventoryForm').reset();
        }

        // Print Single Tag or All Tags (Clean Barcode Tags Only)
        function printSingleTag(key) {
            const item = globalInventory[key];
            if (!item) return;

            const printArea = document.getElementById('printArea');
            printArea.innerHTML = ''; // Clear previous tags

            // Create Tag Cards based on Stock Qty or single tag
            const qty = item.stock > 0 ? item.stock : 1;
            
            for (let i = 0; i < qty; i++) {
                const tag = document.createElement('div');
                tag.className = 'tag-card';
                
                const barcodeId = `barcode-${key}-${i}`;
                
                tag.innerHTML = `
                    <div class="tag-title">DCK FOOTWEAR</div>
                    <div class="tag-details">${item.name || ''}</div>
                    <div class="tag-details">${item.category || ''} | ${item.gender || ''} | Size: ${item.size || ''}</div>
                    <div class="tag-price">LKR ${item.price || 0}</div>
                    <svg id="${barcodeId}"></svg>
                `;
                
                printArea.appendChild(tag);

                // Generate Barcode SVG
                JsBarcode(`#${barcodeId}`, item.barcode || '000000', {
                    format: "CODE128",
                    width: 1.5,
                    height: 35,
                    displayValue: true,
                    fontSize: 10
                });
            }

            window.print();
        }
    </script>
</body>
</html>
