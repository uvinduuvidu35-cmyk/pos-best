<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCK Footwear - Inventory</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0d14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --primary-blue: #0088ff;
            --gradient-start: #0284c7;
            --gradient-end: #0369a1;
            --glow-color: rgba(0, 136, 255, 0.3);
            --sidebar-bg: #0f172a;
            --input-bg: rgba(255, 255, 255, 0.05);
            --option-bg: #1e293b;
            --option-text: #ffffff;
            --danger-color: #ef4444;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary-blue: #0284c7;
            --gradient-start: #0284c7;
            --gradient-end: #0369a1;
            --glow-color: rgba(2, 132, 199, 0.15);
            --sidebar-bg: #ffffff;
            --input-bg: #f1f5f9;
            --option-bg: #ffffff;
            --option-text: #0f172a;
            --danger-color: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .sidebar-brand h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li a {
            display: block;
            padding: 12px 16px;
            color: var(--text-sub);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .nav-links li a:hover, .nav-links li a.active {
            background: rgba(0, 136, 255, 0.15);
            color: var(--primary-blue);
            border: 1px solid var(--primary-blue);
        }

        .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .welcome-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .container {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 25px;
            align-items: start;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .form-select option {
            background-color: var(--option-bg);
            color: var(--option-text);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 8px var(--glow-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: #ffffff;
            flex: 1;
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--card-border);
            font-size: 13px;
        }

        th {
            color: var(--text-sub);
            font-size: 11px;
            text-transform: uppercase;
        }

        code {
            background: rgba(0, 136, 255, 0.1);
            color: var(--primary-blue);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        #printableLabel {
            display: none;
            background: #fff;
            color: #000;
            padding: 15px;
            text-align: center;
            width: 250px;
            font-family: 'Courier New', monospace;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printableLabel, #printableLabel * {
                visibility: visible;
            }
            #printableLabel {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="sidebar-brand">
                <h2>DCK Footwear</h2>
            </div>
            <ul class="nav-links">
                <li><a href="dashbord.html">Dashboard</a></li>
                <li><a href="sales.html">Sales & Billing</a></li>
                <li><a href="inventory.html" class="active">Inventory</a></li>
                <li><a href="Customer.html">Customers</a></li>
                <li><a href="chart.html">Charts</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Sign Out</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="top-header">
            <h1>Inventory Management</h1>
            <div class="user-profile">
                <button class="theme-btn" id="themeToggleBtn">🌓 Theme</button>
                <div class="welcome-badge">
                    <div class="avatar">M</div>
                    <span>Welcome, M4K</span>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="card">
                <h2 class="section-title">Add / Update Product</h2>
                
                <div class="form-group">
                    <label>Barcode / Item Code</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="barcodeInput" class="form-control" placeholder="Scan or Type Barcode..." autofocus>
                        <button class="btn btn-secondary" id="autoBarcodeBtn" type="button">Auto</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="itemName" class="form-control" placeholder="e.g. Formal Shoe">
                </div>

                <div class="form-group">
                    <label>Product Category</label>
                    <select id="productCategory" class="form-select">
                        <option value="Shoe">Shoe</option>
                        <option value="Slipper">Slipper</option>
                        <option value="Umbrella">Umbrella</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Target Gender</label>
                    <select id="targetGender" class="form-select">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Unisex">Unisex</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Size</label>
                    <input type="text" id="itemSize" class="form-control" placeholder="e.g. 7 | 8 | 9">
                </div>

                <div class="form-group">
                    <label>Price (LKR)</label>
                    <input type="number" id="itemPrice" class="form-control" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label>Stock Quantity (Pieces)</label>
                    <input type="number" id="itemStock" class="form-control" placeholder="0">
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="saveProductBtn" type="button">Save Product</button>
                </div>
            </div>

            <div class="card table-container">
                <h2 class="section-title">Stock Inventory</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Barcode</th>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Gender</th>
                            <th>Size</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="printableLabel">
        <h3 style="font-size: 15px; margin-bottom: 2px;">DCK FOOTWEAR</h3>
        <p id="lblItemName" style="font-size: 12px; font-weight: bold;"></p>
        <p id="lblCategoryGender" style="font-size: 11px; color: #555;"></p>
        <p id="lblItemSize" style="font-size: 12px;"></p>
        <p id="lblItemPrice" style="font-size: 13px; margin: 2px 0;"></p>
        <svg id="labelBarcode"></svg>
    </div>

    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🔥 ඔබ ලබා දුන් Firebase Config දත්ත මෙතැනට ඇතුළත් කර ඇත
        const firebaseConfig = {
            apiKey: "AIzaSyAtiYTOWxu00IxuVZkwqt-ohbE-tIfT33E",
            authDomain: "pos-78811.firebaseapp.com",
            databaseURL: "https://pos-78811-default-rtdb.firebaseio.com",
            projectId: "pos-78811",
            storageBucket: "pos-78811.firebasestorage.app",
            messagingSenderId: "408721172867",
            appId: "1:408721172867:web:301073f3f8b6deeaaa2eb6",
            measurementId: "G-2S3D8JEGQH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const inventoryRef = ref(db, 'inventory');

        let globalInventory = {};

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);

            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
            document.getElementById('autoBarcodeBtn').addEventListener('click', generateAutoBarcode);
            document.getElementById('saveProductBtn').addEventListener('click', saveProduct);

            const barcodeInput = document.getElementById('barcodeInput');
            barcodeInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const barcode = barcodeInput.value.trim();
                    if (barcode) {
                        populateProductDetails(barcode);
                    }
                }
            });
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function generateAutoBarcode() {
            const autoCode = "DCK" + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('barcodeInput').value = autoCode;
        }

        function saveProduct() {
            const barcode = document.getElementById('barcodeInput').value.trim();
            const name = document.getElementById('itemName').value.trim();
            const category = document.getElementById('productCategory').value;
            const gender = document.getElementById('targetGender').value;
            const size = document.getElementById('itemSize').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);
            const stock = parseInt(document.getElementById('itemStock').value);

            if (!barcode || !name || !size || isNaN(price) || isNaN(stock)) {
                alert("කරුණාකර සියලු විස්තර නිවැරදිව ඇතුළත් කරන්න!");
                return;
            }

            const itemData = { barcode, name, category, gender, size, price, stock };

            set(ref(db, 'inventory/' + barcode), itemData)
                .then(() => {
                    alert("Product එක සාර්ථකව Save වුණා!");
                    clearForm();
                })
                .catch((error) => {
                    alert("දත්ත සුරැකීමට අපොහොසත් විය: " + error.message);
                });
        }

        function clearForm() {
            document.getElementById('barcodeInput').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemStock').value = '';
            document.getElementById('itemSize').value = '';
        }

        function populateProductDetails(barcode) {
            const item = globalInventory[barcode];
            if (item) {
                document.getElementById('barcodeInput').value = item.barcode;
                document.getElementById('itemName').value = item.name;
                document.getElementById('productCategory').value = item.category;
                document.getElementById('targetGender').value = item.gender;
                document.getElementById('itemSize').value = item.size;
                document.getElementById('itemPrice').value = item.price;
                document.getElementById('itemStock').value = item.stock;
            }
        }

        window.deleteProduct = function(barcode) {
            if (confirm(`ඔබට ස්ථිරවම '${barcode}' බාර්කෝඩ් එක සහිත භාණ්ඩය ඉවත් කිරීමට අවශ්‍යද?`)) {
                remove(ref(db, 'inventory/' + barcode))
                    .catch((error) => alert("ඉවත් කිරීමට නොහැකි විය: " + error.message));
            }
        };

        window.printItemBarcode = function(barcode, name, category, gender, size, price) {
            document.getElementById('lblItemName').textContent = name;
            document.getElementById('lblCategoryGender').textContent = `${category} | ${gender}`;
            document.getElementById('lblItemSize').textContent = `Size: ${size}`;
            document.getElementById('lblItemPrice').textContent = `LKR ${Number(price).toFixed(2)}`;

            JsBarcode("#labelBarcode", barcode, {
                format: "CODE128",
                width: 1.5,
                height: 35,
                displayValue: true,
                fontSize: 10
            });

            document.getElementById('printableLabel').style.display = 'block';
            window.print();
            document.getElementById('printableLabel').style.display = 'none';
        };

        function renderTable(data) {
            const tableBody = document.getElementById('inventoryTable');
            tableBody.innerHTML = '';

            if (!data) {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-sub);">භාණ්ඩ එකතු කර නොමැත.</td></tr>`;
                return;
            }

            const keys = Object.keys(data);
            if (keys.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-sub);">භාණ්ඩ එකතු කර නොමැත.</td></tr>`;
                return;
            }

            keys.forEach((key) => {
                const item = data[key];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><code>${item.barcode}</code></td>
                    <td>${item.name}</td>
                    <td>${item.category}</td>
                    <td>${item.gender}</td>
                    <td>${item.size}</td>
                    <td>${Number(item.price).toFixed(2)}</td>
                    <td>${item.stock}</td>
                    <td style="display: flex; gap: 5px;">
                        <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="printItemBarcode('${item.barcode}', '${item.name}', '${item.category}', '${item.gender}', '${item.size}', ${item.price})">Print Tag</button>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 11px;" onclick="deleteProduct('${item.barcode}')">Delete</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        onValue(inventoryRef, (snapshot) => {
            const data = snapshot.val();
            globalInventory = data || {};
            renderTable(globalInventory);
        });
    </script>
</body>
</html>
