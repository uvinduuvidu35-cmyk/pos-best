<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCK Footwear - Sales & Billing</title>
    <style>
        :root {
            /* Dark Theme Colors (Default) */
            --bg-color: #0b0d14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --primary-blue: #0088ff;
            --gradient-start: #0284c7;
            --gradient-end: #0369a1;
            --glow-color: rgba(0, 136, 255, 0.3);
            --sidebar-bg: #0f172a;
            --input-bg: rgba(255, 255, 255, 0.05);
            --option-bg: #1e293b;
            --option-text: #ffffff;
        }

        [data-theme="light"] {
            /* Light Theme Colors */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary-blue: #0284c7;
            --gradient-start: #0284c7;
            --gradient-end: #0369a1;
            --glow-color: rgba(2, 132, 199, 0.15);
            --sidebar-bg: #ffffff;
            --input-bg: #f1f5f9;
            --option-bg: #ffffff;
            --option-text: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .sidebar-brand h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li a {
            display: block;
            padding: 12px 16px;
            color: var(--text-sub);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .nav-links li a:hover, .nav-links li a.active {
            background: rgba(0, 136, 255, 0.15);
            color: var(--primary-blue);
            border: 1px solid var(--primary-blue);
        }

        .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .welcome-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .pos-container {
            display: flex;
            gap: 20px;
            width: 100%;
            min-height: calc(100vh - 120px);
        }

        .products-section {
            flex: 2;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow-y: auto;
        }

        .cart-section {
            flex: 1;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .barcode-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 25px;
            outline: none;
        }

        .barcode-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 8px var(--glow-color);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .product-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-item:hover {
            transform: translateY(-2px);
            border-color: var(--primary-blue);
        }

        .product-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-info {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .product-price {
            color: var(--primary-blue);
            font-weight: 700;
        }

        .cart-items {
            list-style: none;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 14px;
        }

        .cart-total {
            font-size: 22px;
            font-weight: 700;
            text-align: right;
            margin-bottom: 20px;
            color: var(--primary-blue);
        }

        .checkout-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="sidebar-brand">
                <h2>DCK Footwear</h2>
            </div>
            <ul class="nav-links">
                <li><a href="dashbord.html">Dashboard</a></li>
                <li><a href="sales.html" class="active">Sales & Billing</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="Customer.html">Customers</a></li>
                <li><a href="chart.html">Charts</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Sign Out</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="top-header">
            <h1>Sales & Billing</h1>
            <div class="user-profile">
                <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
                <div class="welcome-badge">
                    <div class="avatar">M</div>
                    <span>Welcome, M4K</span>
                </div>
            </div>
        </div>

        <section class="pos-container">
            <div class="products-section">
                <input type="text" id="barcodeInput" class="barcode-input" placeholder="Scan barcode here to add item..." autofocus>
                
                <h2 class="section-title">Products</h2>
                <div class="product-grid" id="productGrid">
                    <!-- Products dynamically loaded from Firebase Realtime Database 'inventory' node -->
                    <p style="color: var(--text-sub);">Loading products...</p>
                </div>
            </div>

            <div class="cart-section">
                <div>
                    <h2 class="section-title">Current Order</h2>
                    <ul class="cart-items" id="cartItems"></ul>
                </div>
                <div>
                    <div class="cart-total" id="cartTotal">Total: LKR 0.00</div>
                    <button class="checkout-btn" onclick="processCheckout()">Process Receipt</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtiYTOWxu00IxuVZkwqt-ohbE-tIfT33E",
            authDomain: "pos-78811.firebaseapp.com",
            databaseURL: "https://pos-78811-default-rtdb.firebaseio.com",
            projectId: "pos-78811",
            storageBucket: "pos-78811.firebasestorage.app",
            messagingSenderId: "408721172867",
            appId: "1:408721172867:web:301073f3f8b6deeaaa2eb6",
            measurementId: "G-2S3D8JEGQH"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let localProducts = {}; 

        // 🔄 Firebase Database හි 'inventory' Path එකෙන් Data Realtime Load කිරීම
        const inventoryRef = ref(database, 'inventory');
        onValue(inventoryRef, (snapshot) => {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = '';

            const data = snapshot.val();
            if (data) {
                localProducts = data;
                Object.keys(data).forEach(key => {
                    const product = data[key];
                    
                    const productDiv = document.createElement('div');
                    productDiv.className = 'product-item';
                    productDiv.onclick = () => window.addToCart(product.name, product.price);
                    
                    productDiv.innerHTML = `
                        <div class="product-name">${product.name}</div>
                        <div class="product-info">${product.category || ''} | Size: ${product.size || 'N/A'}</div>
                        <div class="product-price">LKR ${Number(product.price).toFixed(2)}</div>
                    `;
                    productGrid.appendChild(productDiv);
                });
            } else {
                productGrid.innerHTML = '<p style="color: var(--text-sub);">No products found in inventory.</p>';
            }
        });

        // 🛒 Process Checkout & Save Order to Firebase ('sales' path)
        window.processCheckout = async function() {
            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }

            try {
                const salesRef = ref(database, 'sales');
                const newSaleRef = push(salesRef);
                await set(newSaleRef, {
                    items: cart,
                    totalAmount: total,
                    timestamp: new Date().toISOString(),
                    date: new Date().toLocaleDateString()
                });

                localStorage.setItem('receiptItems', JSON.stringify(cart));
                localStorage.setItem('receiptTotal', total);

                alert("Transaction successful & saved to Firebase!");
                cart = [];
                total = 0;
                updateCartUI();
            } catch (error) {
                console.error("Error saving sale to Firebase:", error);
                alert("Failed to save transaction: " + error.message);
            }
        };

        // 🔍 Search product by Barcode in Realtime Data
        window.handleBarcode = function(barcode) {
            let found = false;

            for (let key in localProducts) {
                if (localProducts[key].barcode && localProducts[key].barcode.toString() === barcode) {
                    const product = localProducts[key];
                    window.addToCart(product.name, product.price);
                    found = true;
                    break;
                }
            }

            if (!found) {
                alert("Product not found for barcode: " + barcode);
            }
        };
    </script>

    <!-- UI Logic Script -->
    <script>
        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        };

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const barcodeInput = document.getElementById('barcodeInput');
        let cart = [];
        let total = 0;

        barcodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const barcode = barcodeInput.value.trim();
                if (barcode && window.handleBarcode) {
                    window.handleBarcode(barcode);
                }
                barcodeInput.value = '';
            }
        });

        function addToCart(name, price) {
            cart.push({ name, price: Number(price) });
            total += Number(price);
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsList = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            
            cartItemsList.innerHTML = '';
            cart.forEach(item => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `<span>${item.name}</span> <span>LKR ${item.price.toFixed(2)}</span>`;
                cartItemsList.appendChild(li);
            });

            cartTotal.textContent = `Total: LKR ${total.toFixed(2)}`;
        }
    </script>
</body>
</html>
