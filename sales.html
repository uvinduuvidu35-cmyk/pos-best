
<!DOCTYPE html>
<html lang="si" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Billing - DCK Footwear</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        :root[data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
        }

        .custom-input {
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .custom-input:focus {
            border-color: #6366f1;
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-cash-register text-2xl text-indigo-500"></i>
            <h1 class="text-xl font-bold tracking-wide">DCK POS - Sales & Billing</h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="themeToggle" class="p-2 rounded-lg bg-slate-700/30 hover:bg-slate-700/50 transition">
                <i class="fa-solid fa-moon text-yellow-400" id="themeIcon"></i>
            </button>
            <a href="inventory.html" class="text-sm bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition font-medium">
                <i class="fa-solid fa-boxes-stacked mr-1"></i> Inventory
            </a>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Side: Product List & Search (7 Cols) -->
        <section class="lg:col-span-7 flex flex-col gap-4">
            <!-- Search & Barcode Header -->
            <div class="glass-panel p-4 rounded-xl flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Search product by name or code..." class="custom-input w-full pl-10 pr-4 py-2.5 rounded-lg text-sm">
                </div>
                <div class="relative w-full sm:w-48">
                    <i class="fa-solid fa-barcode absolute left-3 top-3.5 text-slate-400"></i>
                    <input type="text" id="barcodeInput" placeholder="Scan Barcode" class="custom-input w-full pl-10 pr-4 py-2.5 rounded-lg text-sm" autofocus>
                </div>
            </div>

            <!-- Products Display Grid -->
            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 max-h-[calc(100vh-220px)] overflow-y-auto pr-1">
                <!-- Products dynamically loaded here from 'inventory' path -->
            </div>
        </section>

        <!-- Right Side: Cart & Checkout (5 Cols) -->
        <section class="lg:col-span-5">
            <div class="glass-panel rounded-xl p-5 flex flex-col h-full justify-between shadow-lg">
                <div>
                    <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                        <h2 class="text-lg font-bold flex items-center gap-2">
                            <i class="fa-solid fa-cart-shopping text-indigo-400"></i> Current Order
                        </h2>
                        <button onclick="clearCart()" class="text-xs text-red-400 hover:text-red-300 font-medium">Clear All</button>
                    </div>

                    <!-- Cart Items Table -->
                    <div class="overflow-y-auto max-h-[350px] my-4 pr-1">
                        <table class="w-full text-left text-sm">
                            <thead>
                                <tr class="text-slate-400 border-b border-slate-700/50">
                                    <th class="pb-2">Item</th>
                                    <th class="pb-2 text-center">Qty</th>
                                    <th class="pb-2 text-right">Price</th>
                                    <th class="pb-2 text-right">Total</th>
                                    <th class="pb-2 text-center"></th>
                                </tr>
                            </thead>
                            <tbody id="cartTableBody">
                                <!-- Cart Items Added Here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Summary & Checkout Section -->
                <div class="border-t border-slate-700 pt-4 space-y-3">
                    <div class="flex justify-between text-sm text-slate-400">
                        <span>Subtotal</span>
                        <span id="subTotal">Rs. 0.00</span>
                    </div>
                    <div class="flex justify-between text-lg font-bold text-indigo-400">
                        <span>Total Amount</span>
                        <span id="grandTotal">Rs. 0.00</span>
                    </div>

                    <button onclick="processCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-circle-check"></i> Complete Sale & Print
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript Section -->
    <script>
        // Firebase Config - Update with your details
        const firebaseConfig = {
            databaseURL: "YOUR_FIREBASE_DATABASE_URL"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allProducts = [];
        let cart = [];

        // Dark / Light Theme Toggle Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            themeIcon.className = newTheme === 'dark' ? 'fa-solid fa-moon text-yellow-400' : 'fa-solid fa-sun text-orange-500';
        });

        // Fetch products in Realtime from 'inventory' Node
        db.ref('inventory').on('value', (snapshot) => {
            allProducts = [];
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    allProducts.push({ id: key, ...data[key] });
                });
            }
            renderProducts(allProducts);
        });

        // Render Product Cards
        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">No items available in inventory.</div>`;
                return;
            }

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-3 rounded-xl cursor-pointer hover:border-indigo-500 transition flex flex-col justify-between';
                card.onclick = () => addToCart(product.id);
                
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-sm truncate">${product.name || 'Unnamed Item'}</h3>
                        <p class="text-xs text-slate-400">Code: ${product.code || 'N/A'}</p>
                    </div>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="font-bold text-indigo-400 text-sm">Rs. ${parseFloat(product.price || 0).toFixed(2)}</span>
                        <span class="text-[10px] px-2 py-0.5 rounded ${product.stock > 0 ? 'bg-emerald-900/50 text-emerald-300' : 'bg-red-900/50 text-red-300'}">
                            Qty: ${product.stock || 0}
                        </span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Add Product to Cart
        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product || product.stock <= 0) return;

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                if (existing.qty < product.stock) {
                    existing.qty++;
                }
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: parseFloat(product.price),
                    qty: 1,
                    maxStock: product.stock
                });
            }
            updateCartUI();
        }

        // Update Cart UI & Totals
        function updateCartUI() {
            const tbody = document.getElementById('cartTableBody');
            tbody.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;

                const row = document.createElement('tr');
                row.className = 'border-b border-slate-700/30';
                row.innerHTML = `
                    <td class="py-2 truncate max-w-[100px]">${item.name}</td>
                    <td class="py-2 text-center">
                        <input type="number" min="1" max="${item.maxStock}" value="${item.qty}" 
                            onchange="changeQty(${index}, this.value)" 
                            class="custom-input w-12 text-center text-xs py-1 rounded">
                    </td>
                    <td class="py-2 text-right">${item.price.toFixed(2)}</td>
                    <td class="py-2 text-right font-semibold">${itemTotal.toFixed(2)}</td>
                    <td class="py-2 text-center">
                        <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-300 text-xs">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('subTotal').innerText = `Rs. ${total.toFixed(2)}`;
            document.getElementById('grandTotal').innerText = `Rs. ${total.toFixed(2)}`;
        }

        function changeQty(index, value) {
            const qty = parseInt(value);
            if (qty > 0 && qty <= cart[index].maxStock) {
                cart[index].qty = qty;
            } else {
                cart[index].qty = 1;
            }
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            updateCartUI();
        }

        // Checkout & Save Sale
        function processCheckout() {
            if (cart.length === 0) return alert("Cart is empty!");

            const saleData = {
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                items: cart,
                totalAmount: cart.reduce((sum, item) => sum + (item.price * item.qty), 0)
            };

            // Save transaction under 'sales' and update stock in 'inventory'
            db.ref('sales').push(saleData).then(() => {
                cart.forEach(item => {
                    const newStock = item.maxStock - item.qty;
                    db.ref(`inventory/${item.id}/stock`).set(newStock);
                });
                alert("Sale Completed Successfully!");
                clearCart();
            });
        }

        // Realtime Search Filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                (p.name && p.name.toLowerCase().includes(term)) || 
                (p.code && p.code.toLowerCase().includes(term))
            );
            renderProducts(filtered);
        });
    </script>
</body>
</html>
