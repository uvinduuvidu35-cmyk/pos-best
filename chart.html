
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCK Footwear - Charts & Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* Dark Theme Colors */
            --bg-color: #0b0d14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --primary-blue: #0088ff;
            --gradient-start: #0284c7;
            --gradient-end: #0369a1;
            --glow-color: rgba(0, 136, 255, 0.3);
            --sidebar-bg: #0f172a;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        [data-theme="light"] {
            /* Light Theme Colors */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary-blue: #0284c7;
            --gradient-start: #0284c7;
            --gradient-end: #0369a1;
            --glow-color: rgba(2, 132, 199, 0.15);
            --sidebar-bg: #ffffff;
            --input-bg: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .sidebar-brand h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li a {
            display: block;
            padding: 12px 16px;
            color: var(--text-sub);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .nav-links li a:hover, .nav-links li a.active {
            background: rgba(0, 136, 255, 0.15);
            color: var(--primary-blue);
            border: 1px solid var(--primary-blue);
        }

        .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .welcome-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .theme-btn, .lang-select {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            outline: none;
        }

        .lang-select option {
            background-color: var(--sidebar-bg);
            color: var(--text-main);
        }

        .control-group {
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .form-select {
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            width: 280px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }

        @media (max-width: 1200px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="sidebar-brand">
                <h2>DCK Footwear</h2>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html" data-i18n="navDashboard">Dashboard</a></li>
                <li><a href="sales.html" data-i18n="navSales">Sales & Billing</a></li>
                <li><a href="inventory.html" data-i18n="navInventory">Inventory</a></li>
                <li><a href="Customer.html" data-i18n="navCustomers">Customers</a></li>
                <li><a href="chart.html" class="active" data-i18n="navCharts">Charts</a></li>
                <li><a href="settings.html" data-i18n="navSettings">Settings</a></li>
            </ul>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="navSignOut">Sign Out</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="top-header">
            <h1 id="pageTitle" data-i18n="pageTitle">Charts & Analytics</h1>
            <div class="user-profile">
                <!-- Language Switcher Dropdown -->
                <select class="lang-select" id="langSelector" onchange="changeLanguage(this.value)">
                    <option value="en">🌐 English</option>
                    <option value="si">🌐 සිංහල</option>
                </select>

                <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
                <div class="welcome-badge">
                    <div class="avatar">M</div>
                    <span id="welcomeText" data-i18n="welcome">Welcome, M4K</span>
                </div>
            </div>
        </div>

        <!-- Top Section: Switchable Doughnut Charts -->
        <section>
            <div class="control-group">
                <label id="lblSelectView" data-i18n="lblSelectView" style="font-size: 13px; color: var(--text-sub); display: block; margin-bottom: 8px;">Select Top View Type:</label>
                <select id="topChartSelector" class="form-select" onchange="updateTopCharts()">
                    <option value="gender" data-i18n="optTargetAudience">Target Audience (Men/Female/Kids)</option>
                    <option value="category" data-i18n="optProductCategory">Product Categories (Shoe/Slipper/Umbrella)</option>
                </select>
            </div>

            <div class="charts-grid">
                <div class="card">
                    <h2 class="section-title" id="titleChart1">Men / Female</h2>
                    <div class="chart-container">
                        <canvas id="chartTop1"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h2 class="section-title" id="titleChart2">Kids</h2>
                    <div class="chart-container">
                        <canvas id="chartTop2"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h2 class="section-title" id="titleChart3">Others</h2>
                    <div class="chart-container">
                        <canvas id="chartTop3"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <!-- Bottom Section: Fixed Bar Charts -->
        <section>
            <h2 class="section-title" id="salesAnalyticsTitle" data-i18n="salesAnalyticsTitle" style="margin-bottom: 20px;">Sales Analytics</h2>
            <div class="charts-grid">
                <div class="card">
                    <h2 class="section-title" id="titleDailySales" data-i18n="titleDailySales">Daily Sales</h2>
                    <div class="chart-container">
                        <canvas id="chartDailySales"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h2 class="section-title" id="titleWeeklySales" data-i18n="titleWeeklySales">Weekly Sales</h2>
                    <div class="chart-container">
                        <canvas id="chartWeeklySales"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h2 class="section-title" id="titleMonthlySales" data-i18n="titleMonthlySales">Monthly Sales</h2>
                    <div class="chart-container">
                        <canvas id="chartMonthlySales"></canvas>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Firebase Credentials
        const firebaseConfig = {
            apiKey: "AIzaSyAtiYTOWxu00IxuVZkwqt-ohbE-tIfT33E",
            authDomain: "pos-78811.firebaseapp.com",
            databaseURL: "https://pos-78811-default-rtdb.firebaseio.com",
            projectId: "pos-78811",
            storageBucket: "pos-78811.firebasestorage.app",
            messagingSenderId: "408721172867",
            appId: "1:408721172867:web:301073f3f8b6deeaaa2eb6",
            measurementId: "G-2S3D8JEGQH"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let chart1, chart2, chart3;
        let chartDaily, chartWeekly, chartMonthly;
        let currentLang = localStorage.getItem('lang') || 'en';

        // Real-time Data Storage
        let rawReceipts = [];

        // Translation Dictionary
        const translations = {
            en: {
                pageTitle: "Charts & Analytics",
                welcome: "Welcome, M4K",
                navDashboard: "Dashboard",
                navSales: "Sales & Billing",
                navInventory: "Inventory",
                navCustomers: "Customers",
                navCharts: "Charts",
                navSettings: "Settings",
                navSignOut: "Sign Out",
                lblSelectView: "Select Top View Type:",
                optTargetAudience: "Target Audience (Men/Female/Kids)",
                optProductCategory: "Product Categories (Shoe/Slipper/Umbrella)",
                salesAnalyticsTitle: "Sales Analytics",
                titleDailySales: "Daily Sales",
                titleWeeklySales: "Weekly Sales",
                titleMonthlySales: "Monthly Sales",
                days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                weeks: ['W1', 'W2', 'W3', 'W4'],
                months: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun']
            },
            si: {
                pageTitle: "ප්‍රස්ථාර සහ විශ්ලේෂණ",
                welcome: "සාදරයෙන් පිළිගනිමු, M4K",
                navDashboard: "මුල් පිටුව",
                navSales: "විකුණුම් සහ බිල්පත්",
                navInventory: "තොග තොරතුරු",
                navCustomers: "පාරිභෝගිකයින්",
                navCharts: "ප්‍රස්ථාර",
                navSettings: "සැකසුම්",
                navSignOut: "නික්මෙන්න",
                lblSelectView: "ඉහළ දර්ශන වර්ගය තෝරන්න:",
                optTargetAudience: "ඉලක්කගත පාරිභෝගිකයින් (පිරිමි/ගැහැණු/ළමා)",
                optProductCategory: "භාණ්ඩ වර්ගීකරණය (සපත්තු/සෙරෙප්පු/කුඩ)",
                salesAnalyticsTitle: "විකුණුම් විශ්ලේෂණය",
                titleDailySales: "දෛනික විකුණුම්",
                titleWeeklySales: "සතිපතා විකුණුම්",
                titleMonthlySales: "මාසික විකුණුම්",
                days: ['සඳුදා', 'අඟහ', 'බදාදා', 'බ්‍රහස්', 'සිකු', 'සෙන', 'ඉරිදා'],
                weeks: ['1 සතිය', '2 සතිය', '3 සතිය', '4 සතිය'],
                months: ['ජන', 'පෙබ', 'මාර්තු', 'අප්‍රේල්', 'මැයි', 'ජූනි']
            }
        };

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            document.getElementById('langSelector').value = currentLang;
            applyTranslations();

            initTopCharts();
            initSalesCharts();

            // Connect Real-time Listener to Firebase Firestore receipts
            listenToRealtimeSales();
        };

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            updateTopCharts();
            updateBottomChartsTheme();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            applyTranslations();
            updateTopCharts();
            updateSalesChartsLanguage();
        }

        function applyTranslations() {
            const langData = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (langData[key]) {
                    el.textContent = langData[key];
                }
            });
        }

        function initTopCharts() {
            const ctx1 = document.getElementById('chartTop1').getContext('2d');
            const ctx2 = document.getElementById('chartTop2').getContext('2d');
            const ctx3 = document.getElementById('chartTop3').getContext('2d');

            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-main') } } }
            };

            chart1 = new Chart(ctx1, { type: 'doughnut', data: { labels: [], datasets: [{ data: [] }] }, options: commonOptions });
            chart2 = new Chart(ctx2, { type: 'doughnut', data: { labels: [], datasets: [{ data: [] }] }, options: commonOptions });
            chart3 = new Chart(ctx3, { type: 'doughnut', data: { labels: [], datasets: [{ data: [] }] }, options: commonOptions });

            updateTopCharts();
        }

        function updateTopCharts() {
            const type = document.getElementById('topChartSelector').value;
            
            // Generate counts from real-time receipts
            let catCounts = { shoes: 0, slippers: 0, umbrellas: 0, caps: 0, others: 0 };
            let audCounts = { male: 0, female: 0, kids: 0, unisex: 0 };

            rawReceipts.forEach(r => {
                let items = Array.isArray(r.items) ? r.items : [r.items || ""];
                items.forEach(itemStr => {
                    let str = String(itemStr).toLowerCase();
                    if (str.includes("shoe") || str.includes("සපත්තු")) catCounts.shoes++;
                    else if (str.includes("slipper") || str.includes("සෙරෙප්පු")) catCounts.slippers++;
                    else if (str.includes("umbrella") || str.includes("කුඩ")) catCounts.umbrellas++;
                    else if (str.includes("cap") || str.includes("තොප්පි")) catCounts.caps++;
                    else catCounts.others++;

                    if (str.includes("men") || str.includes("male") || str.includes("පිරිමි")) audCounts.male++;
                    else if (str.includes("women") || str.includes("female") || str.includes("ගැහැණු") || str.includes("කාන්තා")) audCounts.female++;
                    else if (str.includes("kid") || str.includes("child") || str.includes("ළමා")) audCounts.kids++;
                    else audCounts.unisex++;
                });
            });

            const isSi = currentLang === 'si';
            let data;

            if (type === 'gender') {
                data = {
                    title1: isSi ? "ඉලක්කගත පාරිභෝගික බෙදාහැරීම" : "Target Audience Distribution",
                    title2: isSi ? "ජනගහන වර්ගීකරණය" : "Demographic Breakdown",
                    title3: isSi ? "වෙනත් අංශ" : "Other Segments",
                    chart1: { labels: isSi ? ['පිරිමි', 'ගැහැණු', 'ළමා'] : ['Male', 'Female', 'Kids'], data: [audCounts.male, audCounts.female, audCounts.kids] },
                    chart2: { labels: isSi ? ['පිරිමි', 'කාන්තා', 'ළමුන්'] : ['Men', 'Women', 'Children'], data: [audCounts.male, audCounts.female, audCounts.kids] },
                    chart3: { labels: isSi ? ['පොදු (Unisex)', 'වෙනත්'] : ['Unisex', 'Other'], data: [audCounts.unisex, catCounts.others] }
                };
            } else {
                data = {
                    title1: isSi ? "පාගමන උපකරණ වර්ග" : "Footwear Categories",
                    title2: isSi ? "අමතර උපාංග වර්ග" : "Accessory Categories",
                    title3: isSi ? "සපත්තු වල ස්ත්‍රී/පුරුෂ බෙදීම" : "Gender Split in Shoes",
                    chart1: { labels: isSi ? ['සපත්තු', 'සෙරෙප්පු'] : ['Shoes', 'Slippers'], data: [catCounts.shoes, catCounts.slippers] },
                    chart2: { labels: isSi ? ['කුඩ', 'තොප්පි', 'වෙනත්'] : ['Umbrellas', 'Caps', 'Others'], data: [catCounts.umbrellas, catCounts.caps, catCounts.others] },
                    chart3: { labels: isSi ? ['පිරිමි සපත්තු', 'කාන්තා සපත්තු'] : ['Male Shoes', 'Female Shoes'], data: [audCounts.male, audCounts.female] }
                };
            }

            document.getElementById('titleChart1').textContent = data.title1;
            document.getElementById('titleChart2').textContent = data.title2;
            document.getElementById('titleChart3').textContent = data.title3;

            updateChartData(chart1, data.chart1);
            updateChartData(chart2, data.chart2);
            updateChartData(chart3, data.chart3);
        }

        function updateChartData(chart, newData) {
            chart.data.labels = newData.labels;
            chart.data.datasets[0].data = newData.data;
            chart.data.datasets[0].backgroundColor = ['#0088ff', '#0284c7', '#0369a1', '#94a3b8'];
            chart.options.plugins.legend.labels.color = getComputedStyle(document.documentElement).getPropertyValue('--text-main');
            chart.update();
        }

        function initSalesCharts() {
            const ctxDaily = document.getElementById('chartDailySales').getContext('2d');
            const ctxWeekly = document.getElementById('chartWeeklySales').getContext('2d');
            const ctxMonthly = document.getElementById('chartMonthlySales').getContext('2d');

            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-sub') }, grid: { color: 'transparent' } },
                    y: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-sub') }, grid: { color: getComputedStyle(document.documentElement).getPropertyValue('--card-border') } }
                }
            };

            chartDaily = new Chart(ctxDaily, { 
                type: 'bar', 
                data: { labels: translations[currentLang].days, datasets: [{ data: [0, 0, 0, 0, 0, 0, 0], backgroundColor: '#0088ff' }] }, 
                options: commonOptions 
            });

            chartWeekly = new Chart(ctxWeekly, { 
                type: 'bar', 
                data: { labels: translations[currentLang].weeks, datasets: [{ data: [0, 0, 0, 0], backgroundColor: '#0284c7' }] }, 
                options: commonOptions 
            });

            chartMonthly = new Chart(ctxMonthly, { 
                type: 'line', 
                data: { labels: translations[currentLang].months, datasets: [{ data: [0, 0, 0, 0, 0, 0], borderColor: '#0088ff', fill: true, backgroundColor: 'rgba(0, 136, 255, 0.1)' }] }, 
                options: commonOptions 
            });
        }

        // Firebase Firestore Real-time Listener
        function listenToRealtimeSales() {
            db.collection("receipts").onSnapshot((snapshot) => {
                rawReceipts = [];
                snapshot.forEach((doc) => {
                    rawReceipts.push(doc.data());
                });

                // Calculate Daily, Weekly, and Monthly totals
                let dailyTotals = [0, 0, 0, 0, 0, 0, 0]; // Mon-Sun
                let weeklyTotals = [0, 0, 0, 0];         // W1-W4
                let monthlyTotals = [0, 0, 0, 0, 0, 0];  // Jan-Jun

                rawReceipts.forEach(r => {
                    let total = Number(r.total || 0);
                    let dateStr = r.date || "";

                    if (dateStr) {
                        let parsedDate = new Date(dateStr);
                        if (!isNaN(parsedDate)) {
                            // Day of Week (0=Sun, 1=Mon, ..., 6=Sat)
                            let dayIdx = parsedDate.getDay();
                            let adjustedDay = dayIdx === 0 ? 6 : dayIdx - 1; // Map to Mon=0, Sun=6
                            dailyTotals[adjustedDay] += total;

                            // Week of Month (1-4)
                            let dateNum = parsedDate.getDate();
                            let weekIdx = Math.min(Math.floor((dateNum - 1) / 7), 3);
                            weeklyTotals[weekIdx] += total;

                            // Month (0=Jan, ..., 5=Jun)
                            let monthIdx = parsedDate.getMonth();
                            if (monthIdx < 6) {
                                monthlyTotals[monthIdx] += total;
                            }
                        }
                    }
                });

                // Update Bar Charts with Real-time Data
                chartDaily.data.datasets[0].data = dailyTotals;
                chartWeekly.data.datasets[0].data = weeklyTotals;
                chartMonthly.data.datasets[0].data = monthlyTotals;

                chartDaily.update();
                chartWeekly.update();
                chartMonthly.update();

                // Update Doughnut Charts
                updateTopCharts();
            }, (error) => {
                console.error("Realtime Error: ", error);
            });
        }

        function updateSalesChartsLanguage() {
            if (chartDaily && chartWeekly && chartMonthly) {
                chartDaily.data.labels = translations[currentLang].days;
                chartWeekly.data.labels = translations[currentLang].weeks;
                chartMonthly.data.labels = translations[currentLang].months;

                chartDaily.update();
                chartWeekly.update();
                chartMonthly.update();
            }
        }

        function updateBottomChartsTheme() {
            const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-main');
            const subColor = getComputedStyle(document.documentElement).getPropertyValue('--text-sub');
            const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--card-border');

            [chartDaily, chartWeekly, chartMonthly].forEach(chart => {
                chart.options.scales.x.ticks.color = subColor;
                chart.options.scales.y.ticks.color = subColor;
                chart.options.scales.y.grid.color = borderColor;
                chart.options.plugins.legend.labels.color = textColor;
                chart.update();
            });
        }
    </script>
